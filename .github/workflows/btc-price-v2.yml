name: BTC price to MQTT (v2)

on:
  schedule:
    # Github Actions may delay/drop scheduled tasks under load.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-price-publisher
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lightweight MQTT client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients jq

      - name: Publish validated price and metadata
        shell: bash
        env:
          CG_DEMO_API_KEY: ${{ secrets.CG_DEMO_API_KEY }}
          MQTT_HOST: broker.emqx.io
          TOPIC_BASE: btc/javado13_0922709
        run: |
          set -euo pipefail
          URL='https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true'
          HEADERS=()
          if [[ -n "$CG_DEMO_API_KEY" ]]; then
            HEADERS=(-H "x-cg-demo-api-key: ${CG_DEMO_API_KEY}")
          fi
          RAW="$(curl -fsS --max-time 25 --retry 2 --retry-delay 3 "${HEADERS[@]}" "$URL")"
          NOW="$(date +%s)"
          LIVE="$(jq -ce --argjson now "$NOW" '
            .bitcoin as $b |
            if (($b.usd | type) == "number") and ($b.usd > 1) and ($b.usd < 100000000) then
              {p: $b.usd,
               ch: (if ($b.usd_24h_change | type) == "number" then $b.usd_24h_change else null end),
               ts: (if ($b.last_updated_at | type) == "number" then $b.last_updated_at else $now end)}
            else error("No usable BTC/USD numeric price") end
          ' <<<"$RAW")"
          PRICE="$(jq -er '.p' <<<"$LIVE")"
          echo "Validated BTC/USD quote; publishing legacy + v2 topics."
          mosquitto_pub -h "$MQTT_HOST" -p 1883 -r -t "$TOPIC_BASE/price" -m "$PRICE"
          mosquitto_pub -h "$MQTT_HOST" -p 1883 -r -t "$TOPIC_BASE/live" -m "$LIVE"
