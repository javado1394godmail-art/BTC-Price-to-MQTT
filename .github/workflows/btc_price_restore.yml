name: BTC Live Price to MQTT (v6 Restore)

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-live-price-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MQTT publisher
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients

      - name: Fetch BTC USD (CoinGecko with Kraken fallback) and publish
        env:
          MQTT_HOST: broker.emqx.io
          MQTT_PORT: '1883'
          MQTT_TOPIC_BASE: btc/javado13_0922709
        run: python3 scripts/publish_price.py
