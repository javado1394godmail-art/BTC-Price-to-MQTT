name: BTC Price to MQTT

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients jq

      - name: Fetch BTC price from Binance
        run: |
          PRICE=$(curl -s "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT" | jq -r '.price')
          echo "BTC: $PRICE"
          mosquitto_pub -h broker.emqx.io -p 1883 -t "btc/javado13_0922709/price" -m "$PRICE"

      - name: Fetch 4H candles from Binance
        run: |
          CANDLES=$(curl -s "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=24" | jq -c '{t: [.[][0]], o: [.[][1]|tonumber], h: [.[][2]|tonumber], l: [.[][3]|tonumber], c: [.[][4]|tonumber]}')
          echo "Candles fetched successfully"
          mosquitto_pub -h broker.emqx.io -p 1883 -t "btc/javado13_0922709/candles" -m "$CANDLES"
